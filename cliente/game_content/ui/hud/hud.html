<!DOCTYPE html>
<html>
<head>
    <link rel="stylesheet" type="text/css" href="ui/hud/hud.css">
</head>
<body>
    <!-- Painel de métricas e status -->
    <div id="debug-panel">
        <div id="world-name">FORTRESSVISION</div>
        <div id="fps-val" class="metric">FPS: --</div>
        <div id="pos-val" class="metric">COORD: --</div>
        <div id="z-val" class="metric">Z-LEVEL: --</div>
        <div id="pop-val" class="metric">POP: --</div>
        <div id="world-meta">WORLD: --</div>
        <div id="controls-hint">WASD: Mover | Q/E: Nível Z</div>
    </div>

    <!-- Painel de inspeção de terreno -->
    <div id="inspect-panel">
        <div id="inspect-label">INSPECIONANDO TERRENO</div>
        <div id="inspect-coord" class="inspect-info">COORD: --</div>
        <div id="inspect-mat" class="inspect-info">MAT: --</div>
        <div id="inspect-type" class="inspect-info">TIPO: --</div>
    </div>
</body>
</html>
